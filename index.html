<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدار MADAR</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f7f9;color:#172238}header{background:#071b33;color:white;padding:22px}main{max-width:1050px;margin:auto;padding:25px 16px}.search,.card,.panel{background:white;border:1px solid #e2e6eb;border-radius:18px;padding:16px;margin:14px 0}.search{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #d8dee6}button{cursor:pointer;font-weight:700}.primary{background:#071b33;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:0;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.pad{padding:14px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.price{font-weight:900}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px}.gallery img{width:100%;height:160px;object-fit:cover;border-radius:10px}.gallery img:first-child{height:327px;grid-row:span 2}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:block}.form input{width:100%;margin-top:5px}.notice{background:#fff8e7;padding:13px;border-radius:10px;margin-top:12px}.success{background:#e9f7ef;padding:14px;border-radius:10px}@media(max-width:750px){.search{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr 1fr}.gallery img:first-child{grid-column:span 2;height:240px}.form{grid-template-columns:1fr}}@media(max-width:500px){.search,.grid,.gallery{grid-template-columns:1fr}.gallery img:first-child{grid-column:auto}.search input{grid-column:auto}}</style>
<header><b style="font-size:25px">مدار | MADAR</b><div>حجوزات الشاليهات والاستراحات</div></header><main>
<h1>احجز مكانك بسهولة</h1><p>ابحث، اختر التواريخ، ثم أرسل العربون.</p>
<div class="search"><input id="q" placeholder="اسم الشاليه أو المدينة"><select id="city"><option value="">كل المدن</option><option>البحر الميت</option><option>عمّان</option><option>جرش</option></select><input id="from" type="date"><input id="to" type="date"><button class="primary" onclick="search()">بحث</button></div>
<section id="list" class="grid"></section><section id="details" class="panel" hidden></section><section id="pay" class="panel" hidden></section></main>
<script>
const P=[{id:1,n:"شاليه النسيم",c:"البحر الميت",p:65,g:8,cl:"0790000000",ib:"JO00 0000 0000 0000 0000 0000 0000",im:"https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1000&q=80"},{id:2,n:"استراحة الواحة",c:"عمّان",p:45,g:6,cl:"0791111111",ib:"JO00 1111 1111 1111 1111 1111 1111",im:"https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=1000&q=80"},{id:3,n:"شاليه الياسمين",c:"جرش",p:55,g:7,cl:"0792222222",ib:"JO00 2222 2222 2222 2222 2222 2222",im:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80"}];
let cur,n=0;function render(a=P){list.innerHTML=a.map(x=>`<article class=card><img src="${x.im}"><div class=pad><div class=row><b>${x.n}</b><span>${x.c}</span></div><p>حتى ${x.g} ضيوف</p><div class=row><span class=price>${x.p} د.أ / ليلة</span><button class=primary onclick="openP(${x.id})">عرض الشاليه</button></div></div></article>`).join("")}function search(){let t=q.value,c=city.value;render(P.filter(x=>(!t||x.n.includes(t)||x.c.includes(t))&&(!c||x.c==c)))}function openP(id){cur=P.find(x=>x.id==id);details.hidden=false;pay.hidden=true;details.innerHTML=`<h2>${cur.n}</h2><div class=gallery><img src="${cur.im}"><img src="${cur.im}"><img src="${cur.im}"></div><p>${cur.c} · حتى ${cur.g} ضيوف</p><div class=form><label>الدخول<input id=d1 type=date></label><label>الخروج<input id=d2 type=date></label></div><div id=s class=notice>اختر التواريخ لحساب السعر.</div><button class=primary onclick=go()>متابعة للعربون</button>`;d1.onchange=calc;d2.onchange=calc;details.scrollIntoView({behavior:"smooth"})}function calc(){if(!d1.value||!d2.value)return; n=Math.ceil((new Date(d2.value)-new Date(d1.value))/86400000);if(n<1){s.textContent="تاريخ الخروج يجب أن يكون بعد الدخول";return}let total=n*cur.p;s.innerHTML=`${n} ليلة · الإجمالي <b>${total.toFixed(2)} د.أ</b> · عمولة مدار 10%: <b>${(total*.1).toFixed(2)} د.أ</b>`}function go(){if(n<1){alert("اختر تاريخ الدخول والخروج");return}pay.hidden=false;pay.innerHTML=`<h2>دفع العربون</h2><p>العقار: ${cur.n} · ${n} ليلة</p><div class=notice>CliQ المالك: <b>${cur.cl}</b><br>IBAN: <b>${cur.ib}</b><br>عمولة مدار: 10%</div><p>ارفع إيصال التحويل:</p><input id=file type=file accept="image/*,.pdf"><br><button class=primary onclick=send()>إرسال الإيصال</button>`;pay.scrollIntoView({behavior:"smooth"})}function send(){if(!file.files.length)return alert("ارفع الإيصال أولاً");pay.innerHTML='<div class=success>✓ تم إرسال الإيصال للمراجعة. سيتم إشعار المالك.</div>'}render();
</script></html>
